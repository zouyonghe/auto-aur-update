name: auto-aur-update
on:
  watch:
    types: [started]
  schedule:
    - cron: "30 2 * * *"
    - cron: "45 3 * * *"
  workflow_dispatch:
    inputs:
      rebuild_current:
        description: Rebuild current AUR version once for dependency ABI changes
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  QueuePixelTermRebuild:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.rebuild_current == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Queue durable PixelTerm rebuild request
        env:
          REQUEST_ID: ${{ github.run_id }}
          REQUEST_ATTEMPT: ${{ github.run_attempt }}
        run: timeout --signal=TERM 60s git push origin "HEAD:refs/heads/aur-update-queue/pixelterm-rebuild-${REQUEST_ID}-${REQUEST_ATTEMPT}"

  UpdatePkg:
    if: >-
      !cancelled() &&
      (needs.QueuePixelTermRebuild.result == 'success' ||
       needs.QueuePixelTermRebuild.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'watch' &&
        github.event.repository.owner.id == github.event.sender.id) ||
       (github.event_name == 'schedule' && github.event.schedule == '30 2 * * *'))
    needs: QueuePixelTermRebuild
    concurrency:
      group: auto-aur-update-pixelterm-${{ matrix.PKGBUILDs }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        PKGBUILDs:
        - pixelterm-c

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Detect queued PixelTerm rebuild requests
        id: rebuild_queue
        run: |
          request_refs=$(timeout --signal=TERM 30s git ls-remote --heads origin 'refs/heads/aur-update-queue/pixelterm-rebuild-*' | awk '{ print $2 }' | sort -u)
          if [[ -n "$request_refs" ]]; then
            aur_dir=$(mktemp -d)
            trap 'rm -rf "$aur_dir"' EXIT
            aur_url=${PIXELTERM_AUR_REPO_URL:-https://aur.archlinux.org/pixelterm-c.git}
            timeout --signal=TERM 60s git clone --quiet "$aur_url" "$aur_dir/package"
            published_request_refs=$(timeout --signal=TERM 30s git -C "$aur_dir/package" log --all --format=%B \
              | awk '/^PixelTerm-Rebuild-Requests:$/ { in_marker=1; next } in_marker && NF == 0 { in_marker=0 } in_marker { print }')
            active_refs=''
            while IFS= read -r request_ref; do
              [[ -n "$request_ref" ]] || continue
              if ! grep -Fqx -- "$request_ref" <<< "$published_request_refs"; then
                active_refs+="$request_ref"$'\n'
              fi
            done <<< "$request_refs"
            {
              echo 'pending=true'
              echo 'refs<<EOF'
              printf '%s\n' "$request_refs"
              echo EOF
              echo 'active_refs<<EOF'
              printf '%s' "$active_refs"
              echo EOF
              if [[ -n "$active_refs" ]]; then
                echo 'rebuild_needed=true'
              else
                echo 'rebuild_needed=false'
              fi
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'pending=false'
              echo 'rebuild_needed=false'
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: ./build-aur-action
        with:
          pkgname: ${{ matrix.PKGBUILDs }}
          pkgdir: ${{ matrix.PKGBUILDs }}
          rebuild_current: ${{ steps.rebuild_queue.outputs.rebuild_needed == 'true' && 'true' || 'false' }}

      - name: Publish AUR package
        uses: ./.github/actions/deploy-aur
        with:
          pkgname: ${{ matrix.PKGBUILDs }}
          pkgbuild: ${{ matrix.PKGBUILDs }}/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: |
            Update AUR package
            PixelTerm-Rebuild-Requests:
            ${{ steps.rebuild_queue.outputs.refs }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
          allow_empty_commits: false
      - name: Acknowledge published PixelTerm rebuild requests
        if: steps.rebuild_queue.outputs.pending == 'true'
        env:
          REQUEST_REFS: ${{ steps.rebuild_queue.outputs.refs }}
        run: |
          while IFS= read -r request_ref; do
            [[ -n "$request_ref" ]] || continue
            if ! remote_ref=$(timeout --signal=TERM 30s git ls-remote --heads origin "$request_ref"); then
              echo "Failed to inspect queued ref $request_ref" >&2
              exit 1
            fi
            [[ -n "$remote_ref" ]] || continue
            deleted=false
            for attempt in 1 2 3; do
              if timeout --signal=TERM 60s git push origin ":$request_ref"; then
                deleted=true
                break
              fi
              if ! remote_ref=$(timeout --signal=TERM 30s git ls-remote --heads origin "$request_ref"); then
                echo "Failed to verify cleanup for $request_ref" >&2
                exit 1
              fi
              if [[ -z "$remote_ref" ]]; then
                deleted=true
                break
              fi
              sleep "$attempt"
            done
            if [[ "$deleted" != true ]]; then
              echo "Failed to remove queued ref $request_ref after retries" >&2
              exit 1
            fi
          done <<< "$REQUEST_REFS"

  UpdateAstrBot:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && github.event.schedule == '45 3 * * *'))
    concurrency:
      group: auto-aur-update-astrbot
      cancel-in-progress: false
    uses: ./.github/workflows/publish-astrbot-desktop-bin.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit

  Task:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'watch' &&
        github.event.repository.owner.id == github.event.sender.id) ||
       (github.event_name == 'schedule' && github.event.schedule == '30 2 * * *'))
    concurrency:
      group: auto-aur-update-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Make Time log #Api调用
      run: |
        echo "$(date +'%Y-%m-%d %H:%M:%S') begin" > time.log
    - name: Commit #上传新的refresh_token到仓库
      run: |
        git config --local user.email 1259085392z@gmail.com
        git config --local user.name buding
        git add .
        git commit -m "update new time.log" -a || echo "No changes to commit"
    - name: Pull before push
      run: |
        git pull --rebase origin main
    - name: Push changes
      run: git push origin HEAD:main
