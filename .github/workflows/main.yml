name: auto-aur-update
on:
  watch:
    types: [started]
  schedule:
    - cron: "30 2 * * *"
    - cron: "45 3 * * *"
  workflow_dispatch:
    inputs:
      rebuild_current:
        description: Rebuild current AUR version once for dependency ABI changes
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  QueuePixelTermRebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.rebuild_current == true
        with:
          ref: main
          fetch-depth: 0
      - name: Queue durable PixelTerm rebuild request
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.rebuild_current == true
        env:
          REQUEST_ID: ${{ github.run_id }}
          REQUEST_ATTEMPT: ${{ github.run_attempt }}
        run: git push origin "HEAD:refs/heads/aur-update-queue/pixelterm-rebuild-${REQUEST_ID}-${REQUEST_ATTEMPT}"

  UpdatePkg:
    if: >-
      always() &&
      needs.QueuePixelTermRebuild.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'watch' &&
        github.event.repository.owner.id == github.event.sender.id) ||
       (github.event_name == 'schedule' && github.event.schedule == '30 2 * * *'))
    needs: QueuePixelTermRebuild
    concurrency:
      group: auto-aur-update-pixelterm-${{ matrix.PKGBUILDs }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        PKGBUILDs:
        - pixelterm-c

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Detect queued PixelTerm rebuild requests
        id: rebuild_queue
        run: |
          request_refs=$(git ls-remote --heads origin 'refs/heads/aur-update-queue/pixelterm-rebuild-*' | awk '{ print $2 }')
          if [[ -n "$request_refs" ]]; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
            {
              echo 'refs<<EOF'
              printf '%s\n' "$request_refs"
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./build-aur-action
        with:
          pkgname: ${{ matrix.PKGBUILDs }}
          pkgdir: ${{ matrix.PKGBUILDs }}
          rebuild_current: ${{ steps.rebuild_queue.outputs.pending == 'true' && 'true' || 'false' }}

      - name: Publish AUR package
        uses: ./.github/actions/deploy-aur
        with:
          pkgname: ${{ matrix.PKGBUILDs }}
          pkgbuild: ${{ matrix.PKGBUILDs }}/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update AUR package
          ssh_keyscan_types: rsa,ecdsa,ed25519
          allow_empty_commits: false
      - name: Acknowledge published PixelTerm rebuild requests
        if: steps.rebuild_queue.outputs.pending == 'true'
        env:
          REQUEST_REFS: ${{ steps.rebuild_queue.outputs.refs }}
        run: |
          while IFS= read -r request_ref; do
            [[ -n "$request_ref" ]] || continue
            git push origin ":$request_ref"
          done <<< "$REQUEST_REFS"

  UpdateAstrBot:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && github.event.schedule == '45 3 * * *'))
    concurrency:
      group: auto-aur-update-astrbot
      cancel-in-progress: false
    uses: ./.github/workflows/publish-astrbot-desktop-bin.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit

  Task:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'watch' &&
        github.event.repository.owner.id == github.event.sender.id) ||
       (github.event_name == 'schedule' && github.event.schedule == '30 2 * * *'))
    concurrency:
      group: auto-aur-update-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Make Time log #Api调用
      run: |
        echo "$(date +'%Y-%m-%d %H:%M:%S') begin" > time.log
    - name: Commit #上传新的refresh_token到仓库
      run: |
        git config --local user.email 1259085392z@gmail.com
        git config --local user.name buding
        git add .
        git commit -m "update new time.log" -a || echo "No changes to commit"
    - name: Pull before push
      run: |
        git pull --rebase origin main
    - name: Push changes
      run: git push origin HEAD:main
