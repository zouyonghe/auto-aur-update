name: Sync repository task

on:
  watch:
    types: [started]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-aur-update-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'watch' &&
        github.event.repository.owner.id == github.event.sender.id) ||
       (github.event_name == 'schedule' && github.event.schedule == '30 2 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Make Time log
        run: |
          echo "$(date +'%Y-%m-%d %H:%M:%S') begin" > time.log
      - name: Commit refresh token changes
        run: |
          git config --local user.email 1259085392z@gmail.com
          git config --local user.name buding
          git add time.log
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update new time.log"
          fi
      - name: Push changes
        shell: bash
        run: |
          export LC_ALL=C
          for attempt in 1 2 3; do
            echo "Syncing main (attempt $attempt/3)"
            git fetch origin main
            git rebase origin/main
            if push_output=$(git push --porcelain origin HEAD:main 2>&1); then
              printf '%s\n' "$push_output"
              exit 0
            else
              push_status=$?
              printf '%s\n' "$push_output" >&2
              if ! grep -Eq '\[rejected\] \((fetch first|non-fast-forward)\)' <<< "$push_output"; then
                exit "$push_status"
              fi
            fi
          done
          echo "Push failed after 3 concurrent updates to main" >&2
          exit 1
