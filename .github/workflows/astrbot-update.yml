name: Update AstrBot AUR package

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-aur-update-astrbot
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && github.event.schedule == '45 3 * * *'))
    uses: ./.github/workflows/publish-astrbot-desktop-bin.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit
