name: Publish AstrBot AUR package

on:
  schedule:
    - cron: '45 3 * * *'
  workflow_run:
    workflows: ['Update AstrBot AUR package']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: astrbot-aur-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    uses: ./.github/workflows/build-astrbot-desktop-bin.yml
    with:
      source_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

  publish:
    needs: prepare
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: astrbot-pkgbuild
          path: astrbot-desktop-bin
      - name: Verify prepared artifact source
        env:
          PREPARED_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          artifact_sha=$(cat astrbot-desktop-bin/source-sha)
          checkout_sha=$(git rev-parse HEAD)
          if [[ "$artifact_sha" != "$PREPARED_SHA" || "$checkout_sha" != "$PREPARED_SHA" ]]; then
            echo '::error::Prepared package does not match the checked out source commit.'
            exit 1
          fi
      - name: Recheck stable version and asset bytes before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/astrbot-desktop-bin.py --verify
      - name: Publish AUR metadata
        uses: ./.github/actions/deploy-aur
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release_verifier: scripts/astrbot-desktop-bin.py
          pkgname: astrbot-desktop-bin
          pkgbuild: astrbot-desktop-bin/PKGBUILD
          expected_revision_file: astrbot-desktop-bin/aur-revision
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update astrbot-desktop-bin
          allow_empty_commits: false
