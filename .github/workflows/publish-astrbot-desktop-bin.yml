name: Publish AstrBot AUR package

on:
  workflow_call:
    inputs:
      source_sha:
        description: Commit used to prepare and build the package
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-astrbot-desktop-bin.yml
    with:
      source_sha: ${{ inputs.source_sha }}

  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: astrbot-pkgbuild
          path: astrbot-desktop-bin
      - name: Verify prepared artifact source
        env:
          PREPARED_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          artifact_sha=$(cat astrbot-desktop-bin/source-sha)
          checkout_sha=$(git rev-parse HEAD)
          if [[ "$artifact_sha" != "$PREPARED_SHA" || "$checkout_sha" != "$PREPARED_SHA" ]]; then
            echo '::error::Prepared package does not match the checked out source commit.'
            exit 1
          fi
      - name: Recheck stable version and asset bytes before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/astrbot-desktop-bin.py --verify
      - name: Publish AUR metadata
        uses: ./.github/actions/deploy-aur
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          release_verifier: scripts/astrbot-desktop-bin.py
          pkgname: astrbot-desktop-bin
          pkgbuild: astrbot-desktop-bin/PKGBUILD
          expected_revision_file: astrbot-desktop-bin/aur-revision
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update astrbot-desktop-bin
          allow_empty_commits: false
