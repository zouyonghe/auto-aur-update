name: Update PixelTerm AUR package

on:
  watch:
    types: [started]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishes per branch; triggers reconcile package state.
# A new pending run can replace an older pending run; this is not a FIFO queue.
concurrency:
  group: auto-aur-update-pixelterm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'watch' &&
        github.event.repository.owner.id == github.event.sender.id) ||
       (github.event_name == 'schedule' && github.event.schedule == '30 2 * * *'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      build_required: ${{ steps.prepared.outputs.build_required }}
      artifact_id: ${{ steps.snapshot.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Resolve PixelTerm release without exposing credentials to builds
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! tag="$(gh api repos/zouyonghe/PixelTerm-C/releases/latest --jq .tag_name)" ||
             ! [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            unset GH_TOKEN GITHUB_TOKEN
            release_url="$(curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 60 -o /dev/null -w '%{url_effective}' \
              https://github.com/zouyonghe/PixelTerm-C/releases/latest)"
            [[ "$release_url" =~ ^https://github\.com/zouyonghe/PixelTerm-C/releases/tag/(v[0-9]+(\.[0-9]+)*)$ ]] || exit 1
            tag="${BASH_REMATCH[1]}"
          fi
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || exit 1
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Prepare PixelTerm package
        uses: ./build-aur-action
        env:
          PIXELTERM_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          pkgname: pixelterm-c
          pkgdir: pixelterm-c

      - name: Record build decision
        id: prepared
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          required="$(cat pixelterm-c/build-required)"
          [[ "$required" == true || "$required" == false ]] || exit 1
          printf 'build_required=%s\n' "$required" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$SOURCE_SHA" > pixelterm-c/source-sha

      - name: Protect prepared deployment snapshot
        id: snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pixelterm-prepared
          path: |
            pixelterm-c/PKGBUILD
            pixelterm-c/.aur-revision
            pixelterm-c/source-sha
          include-hidden-files: true
          if-no-files-found: error

  build:
    needs: update
    if: needs.update.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - name: Install isolated build tools
        run: |
          for attempt in 1 2 3; do
            status=0
            timeout --signal=TERM --kill-after=10s 180s pacman -Syu --noconfirm --needed git diffutils || status=$?
            if [ "$status" -eq 0 ]; then break; fi
            if [ "$attempt" -eq 3 ] || [ "$status" -eq 130 ] || [ "$status" -eq 137 ] || [ "$status" -eq 143 ]; then exit "$status"; fi
            sleep "$((attempt * 5))"
          done
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.update.outputs.artifact_id }}
          merge-multiple: true
          path: prepared
      - name: Build disposable source workspace without publishing credentials
        run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          runuser -u builder -- bash scripts/build-pixelterm.sh prepared

  publish:
    needs: [update, build]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.update.result == 'success' &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && needs.update.outputs.build_required == 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.update.outputs.artifact_id }}
          merge-multiple: true
          path: pixelterm-c
      - name: Publish PixelTerm package
        uses: ./.github/actions/deploy-aur
        with:
          pkgname: pixelterm-c
          pkgbuild: pixelterm-c/PKGBUILD
          expected_revision_file: pixelterm-c/.aur-revision
          expected_source_revision_file: pixelterm-c/source-sha
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update pixelterm-c
          allow_empty_commits: false
          ssh_keyscan_types: rsa,ecdsa,ed25519
