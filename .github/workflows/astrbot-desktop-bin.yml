name: Validate AstrBot AUR package

on:
  pull_request:
    paths:
      - 'astrbot-desktop-bin/**'
      - 'pixelterm-c/**'
      - 'scripts/astrbot-desktop-bin.py'
      - 'scripts/pixelterm-c.sh'
      - 'scripts/build-pixelterm.sh'
      - 'tests/**'
      - 'build-aur-action/**'
      - '.github/workflows/astrbot-desktop-bin.yml'
      - '.github/workflows/pixelterm-update.yml'
      - '.github/workflows/astrbot-update.yml'
      - '.github/workflows/task-sync.yml'
      - '.github/workflows/publish-astrbot-desktop-bin.yml'
      - '.github/workflows/build-astrbot-desktop-bin.yml'
      - '.github/actions/deploy-aur/**'
permissions:
  contents: read

concurrency:
  group: astrbot-aur-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  deployment-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare isolated test workspace
        run: |
          test_workspace="$(mktemp -d "$RUNNER_TEMP/aur-tests.XXXXXX")"
          tar --exclude='.git' -cf - . | tar -xf - -C "$test_workspace"
          printf 'TEST_WORKSPACE=%s\n' "$test_workspace" >> "$GITHUB_ENV"
      - name: Build and smoke-test deployment tools without credentials
        run: |
          docker build -t aur-deploy-test .github/actions/deploy-aur
          docker build -t aur-prepare-test build-aur-action
          docker run --rm --entrypoint /bin/bash aur-prepare-test -euc 'command -v cmp'
          docker run --rm --entrypoint /bin/bash -v "$TEST_WORKSPACE:/repo:ro" -w /repo aur-deploy-test -euc '
            test ! -e /repo/.git
            printf same > /tmp/left
            printf same > /tmp/right
            cmp -s /tmp/left /tmp/right
            printf different > /tmp/right
            status=0
            cmp -s /tmp/left /tmp/right || status=$?
            test "$status" -eq 1
            python3 -m unittest discover -s tests -v
          '

  validate:
    uses: ./.github/workflows/build-astrbot-desktop-bin.yml
    with:
      source_sha: ${{ github.sha }}
